<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#3773bc"/></marker></defs><rect width="1400" height="1050" fill="#f4f7fb"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#16364f}.title{font-size:29px;font-weight:bold}.h{font-size:21px;font-weight:bold}.t{font-size:18px}.small{font-size:15px}.wire{stroke:#3773bc;stroke-width:3;fill:none;marker-end:url(#arr)}</style><text x="40" y="50" class="title">RoomGuard V1.1 通用基板｜电源与接口方案</text><text x="40" y="85" class="small">两块 ESP 均为每侧15针、间距2.54mm；两排针中心距及模块尺寸仍待实测。</text><rect x="35" y="115" width="1330" height="145" rx="12" fill="#ffffff" stroke="#d7e2ed" stroke-width="2"/><text x="60" y="151" class="h">① 外部供电</text><rect x="65" y="168" width="210" height="65" rx="12" fill="#e8f1fc" stroke="#d7e2ed" stroke-width="2"/><text x="80" y="192" class="t">稳压5V输入</text><text x="80" y="220" class="small">J1：+5V / GND</text><rect x="340" y="168" width="290" height="65" rx="12" fill="#e8f1fc" stroke="#d7e2ed" stroke-width="2"/><text x="355" y="192" class="t">PTC＋反接保护</text><text x="355" y="220" class="small">F1 / AO3401A</text><rect x="695" y="168" width="210" height="65" rx="12" fill="#e8f1fc" stroke="#d7e2ed" stroke-width="2"/><text x="710" y="192" class="t">总电源开关</text><text x="710" y="220" class="small">SW1</text><rect x="970" y="168" width="350" height="65" rx="12" fill="#e8f1fc" stroke="#d7e2ed" stroke-width="2"/><text x="985" y="192" class="t">P5V 电源母线</text><text x="985" y="220" class="small">开发板VIN / MQ-2 / 蜂鸣器</text><path class="wire" d="M280 200L330 200"/><path class="wire" d="M635 200L685 200"/><path class="wire" d="M910 200L960 200"/><rect x="35" y="285" width="650" height="235" rx="12" fill="#ffffff" stroke="#d7e2ed" stroke-width="2"/><text x="60" y="325" class="h">② 两种 ESP 插座：每板只安装一块</text><rect x="65" y="350" width="270" height="100" rx="12" fill="#e8f6f2" stroke="#d7e2ed" stroke-width="2"/><text x="85" y="390" class="h">ESP32：101 房间</text><text x="85" y="425" class="small">独立VIN与3V3引出</text><rect x="360" y="350" width="290" height="100" rx="12" fill="#e8f6f2" stroke="#d7e2ed" stroke-width="2"/><text x="380" y="390" class="h">ESP8266：102 房间</text><text x="380" y="425" class="small">A0量程须核验</text><text x="68" y="490" class="small">JP1选择 ESP_3V3；JP2/JP3只使能所选开发板VIN。</text><rect x="715" y="285" width="650" height="235" rx="12" fill="#ffffff" stroke="#d7e2ed" stroke-width="2"/><text x="740" y="325" class="h">③ 独立3.3V传感器电源</text><rect x="745" y="355" width="240" height="90" rx="12" fill="#fff1de" stroke="#d7e2ed" stroke-width="2"/><text x="765" y="389" class="h">AP2112K-3.3</text><text x="765" y="422" class="small">输入P5V，输出SENSOR_3V3</text><path class="wire" d="M1000 398L1060 398"/><text x="1080" y="385" class="t">DHT11 / 火焰模块</text><text x="1080" y="419" class="small">传感器侧上拉</text><text x="748" y="490" class="small">不把 SENSOR_3V3 与开发板自身3V3稳压器输出并联。</text><rect x="35" y="550" width="1330" height="315" rx="12" fill="#ffffff" stroke="#d7e2ed" stroke-width="2"/><text x="60" y="591" class="h">④ 按信号类型分别适配，保持软件与硬件一致</text><text x="65" y="622" class="h">MQ-2 AO</text><text x="360" y="622" class="t">MCP6002 缓冲 → 两路分压</text><text x="360" y="646" class="small">ESP32：20k/10k，比例3.0；ESP8266：56k/10k，比例6.6</text><text x="65" y="678" class="h">MQ DO / 火焰 DO</text><text x="360" y="678" class="t">SN74LVC2G17：5V容忍输入 → ESP参考电平</text><text x="360" y="702" class="small">非反相、Ioff；输出供电来自所选ESP_3V3</text><text x="65" y="734" class="h">DHT DATA / 蜂鸣器 I/O</text><text x="360" y="734" class="t">BSS138：分别适配双向数据／低触发控制</text><text x="360" y="758" class="small">两侧上拉到各自电源；模块输入电流、时序须实测</text><text x="65" y="790" class="h">RGB 三色模块</text><text x="360" y="790" class="t">共阴极接口＋各通道330Ω保护电阻</text><text x="360" y="814" class="small">GPIO映射一致，实际亮度与电流核验后定稿</text><rect x="35" y="891" width="1330" height="115" rx="12" fill="#fff1de" stroke="#d7e2ed" stroke-width="2"/><text x="60" y="928" class="h">工程状态：原理图＋未布线布局草案，不是可制造PCB。</text><text x="60" y="966" class="small">USB烧录须把ESP取下单独连接；尺寸、脚序、电压、热与时序验收后，再进行布线、ERC/DRC和打板定稿。</text></svg>