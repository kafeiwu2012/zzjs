<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040"><rect width="1400" height="1040" fill="#f4f7fc"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#173458} .title{font-size:27px;font-weight:bold}.h{font-size:21px;font-weight:bold}.t{font-size:17px}.small{font-size:15px}.wire{stroke:#2865df;stroke-width:3;fill:none}.box{fill:white;stroke:#bfcede;stroke-width:2}</style><text x="40" y="50" class="title">MQ-2 与 ESP 电平适配参考电路</text><text x="40" y="82" class="small">连接前核验实物；禁止5V直接进入GPIO/A0。所有GND共地。</text><rect class="box" x="30" y="110" width="1340" height="245" rx="9"/><text x="55" y="148" class="h">① ESP32 AO：10kΩ / 15kΩ，比例1.667（如ADC接近饱和可改12kΩ / 15kΩ）</text><text x="65" y="214" class="t">MQ-2 AO</text><path class="wire" d="M195,210 L300,210"/><rect x="300" y="199" width="100" height="22" fill="#e8f0fc" stroke="#2865df" stroke-width="2"/><text x="300" y="186" class="small">R上 10kΩ</text><path class="wire" d="M400,210 L600,210"/><circle cx="520" cy="210" r="5" fill="#2865df"/><path class="wire" d="M600,210 L1080,210"/><text x="1090" y="216" class="t">GPIO34 / ADC1</text><path class="wire" d="M520,210 L520,250"/><rect x="509" y="250" width="22" height="45" fill="#e8f0fc" stroke="#2865df" stroke-width="2"/><text x="555" y="280" class="t">R下 15kΩ</text><path class="wire" d="M520,295 L520,320"/><path class="wire" d="M498,320 L542,320"/><text x="65" y="307" class="small">5.0V → 3.0V；5.25V → 3.15V，须测量输入范围与ADC有效量程。</text><rect class="box" x="30" y="375" width="1340" height="235" rx="9"/><text x="55" y="414" class="h">② ESP8266 AO：保守分压56kΩ / 10kΩ，比例6.6</text><text x="65" y="478" class="t">MQ-2 AO</text><path class="wire" d="M195,475 L300,475"/><rect x="300" y="464" width="100" height="22" fill="#e8f0fc" stroke="#2865df" stroke-width="2"/><text x="300" y="451" class="small">R上 56kΩ</text><path class="wire" d="M400,475 L1080,475"/><circle cx="520" cy="475" r="5" fill="#2865df"/><text x="1090" y="481" class="t">A0连接器</text><path class="wire" d="M520,475 L520,510"/><rect x="509" y="510" width="22" height="45" fill="#e8f0fc" stroke="#2865df" stroke-width="2"/><text x="555" y="538" class="t">R下 10kΩ</text><path class="wire" d="M520,555 L520,575"/><path class="wire" d="M498,575 L542,575"/><text x="65" y="588" class="small">5.25V → 约0.795V；兼顾未知A0量程的输入保护，实际换算仍需核验板载分压与标定。</text><rect class="box" x="30" y="630" width="1340" height="295" rx="9"/><text x="55" y="670" class="h">③ MQ DO 与低触发蜂鸣器：BSS138电平板（两个独立通道，逻辑不反相）</text><rect class="box" x="500" y="705" width="340" height="170" rx="9"/><text x="535" y="738" class="h">BSS138 转换板</text><text x="525" y="775" class="t">LV=3.3V   HV=5V</text><text x="525" y="809" class="t">LV1                 HV1</text><text x="525" y="846" class="t">LV2                 HV2</text><text x="65" y="808" class="t">ESP MQ数字输入</text><path class="wire" d="M250,803 L500,803"/><path class="wire" d="M840,803 L1050,803"/><text x="1060" y="809" class="t">MQ-2 DO</text><text x="65" y="845" class="t">ESP 蜂鸣器GPIO</text><path class="wire" d="M250,840 L500,840"/><path class="wire" d="M840,840 L1050,840"/><text x="1060" y="846" class="t">蜂鸣器 I/O</text><text x="65" y="897" class="small">LV2上拉10kΩ至3.3V，复位默认关闭；各侧上拉、电流与单边断电行为须实测。</text><text x="40" y="964" class="t">软件对应：AO使用实际分压比例与板ADC量程；DO与蜂鸣器均保持低有效。</text><text x="40" y="998" class="small">注意：图中为参考功能接线，非已完成电气验收的PCB原理图。电源、引脚及器件额定值见硬件手册。</text></svg>